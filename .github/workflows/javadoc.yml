name: Deploy Javadocs to GitHub Pages (Ant)

on:
  push:
    branches: [ "main" ] # O "master" si tu rama principal se llama así

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17' # Cambia la versión de Java según tu proyecto

      - name: Generate Javadoc with Ant
        run: ant javadoc # Llama directamente al target de tu build.xml

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: Sistema_EN/Sistema_en # Debe coincidir con el 'destdir' de tu build.xml
