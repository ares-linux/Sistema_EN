name: Deploy Javadocs to GitHub Pages (Ant)

on:
  push:
    branches: [ "main" ]
    paths:
      - 'Sistema_en/src/**'
      - 'Sistema_en/lib/**'
      - 'Sistema_en/nbproject/**'
      - 'Sistema_en/build.xml'
      - '.github/workflows/javadoc.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Generate Javadoc with Ant
        run: ant javadoc -Djavadoc.additionalparam="-Xdoclint:none"
        working-directory: Sistema_en

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: Sistema_en/dist/javadoc
