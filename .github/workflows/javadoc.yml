name: Deploy Javadocs to GitHub Pages (Ant)

on:
  push:
    branches: [ "main" ] # O "master" si tu rama principal se llama así

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17' # Cambia la versión de Java si usas otra (ej. 11, 21)

      - name: Generate Javadoc with Ant
        run: ant javadoc
        working-directory: Sistema_en # <--- ¡Esto es clave! Entra a la carpeta de tu proyecto

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: Sistema_en/dist/javadoc # <--- Apunta a la ruta real dentro de Sistema_en
