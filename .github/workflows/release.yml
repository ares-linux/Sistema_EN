name: Verificar build (tags)

on:
  push:
    tags:
      - 'v*'

jobs:
  build-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar código
        uses: actions/checkout@v7

      - name: Configurar Java
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Compilar con Ant
        run: ant -f Sistema_en/build.xml -Dlibs.CopyLibs.classpath=${{ github.workspace }}/Sistema_en/lib/org-netbeans-modules-java-j2seproject-copylibstask.jar jar

      - name: Configurar Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Validar empaquetado con jDeploy (sin publicar)
        working-directory: ./Sistema_en
        run: |
          npm install -g jdeploy
          jdeploy package

      - name: Verificar artefacto generado
        run: test -f Sistema_en/dist/Sistema_en.jar
